<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menyu</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15161c;--card:#1f212a;--ink:#f4ead8;--muted:#a9a190;--gold:#e9b45f;--flame:#f2661f;--flame2:#ff9c3d;--kraft:#b98a5a;--line:#2e303b;--display:'Almendra',Georgia,serif;--body:'Outfit',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;padding-bottom:calc(env(safe-area-inset-bottom,0) + 90px);background-image:radial-gradient(900px 400px at 50% -80px,color-mix(in srgb,var(--flame) 24%,transparent),transparent 70%)}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
header{text-align:center;padding:calc(env(safe-area-inset-top,0) + 64px) 0 14px}
.logo{font-family:var(--display);font-size:clamp(52px,17vw,78px);line-height:1;margin:0;background:linear-gradient(180deg,var(--flame2),var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo img{max-height:90px;max-width:80%}
#mode{position:fixed;top:calc(env(safe-area-inset-top,0) + 10px);left:50%;transform:translateX(-50%);z-index:30;display:flex;background:rgba(20,21,26,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:4px}
#mode button{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 18px;border-radius:99px;cursor:pointer}
#mode button.on{background:var(--flame);color:#fff}
section h2{font-family:var(--display);font-size:30px;color:var(--gold);margin:26px 0 2px}
.note{margin:0 0 10px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}
.img{aspect-ratio:1/1;background:#101116}
.img img,.dimg img,.bg img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:12px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--flame) 22%,#1b1c23),#14151a 78%)}
.ph span{font-family:var(--display);font-size:clamp(20px,6vw,30px);color:var(--gold);opacity:.4}
.cp{padding:10px 12px 12px}
.cp h3{margin:0;font-size:16px;font-weight:600;padding-right:56px}
.cp small{color:var(--muted)}
.pr{display:grid;place-items:center;min-width:54px;height:54px;padding:0 6px;border-radius:50%;background:#101116;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-size:15px;line-height:1}
.card .pr{position:absolute;right:8px;bottom:8px}
.qty{display:flex;align-items:center;gap:8px}
.card .qty{position:absolute;left:8px;top:8px;background:rgba(15,16,20,.75);border-radius:99px;padding:3px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--flame);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.qty button.minus{background:#3a3d4a}
.qty b{min-width:18px;text-align:center}
#story{position:fixed;inset:0;z-index:10;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none}
.sl{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden}
.bg{position:absolute;inset:0}
.bg .ph{font-size:min(38vw,180px)}
.ov{position:absolute;left:0;right:0;bottom:0;padding:90px 20px calc(env(safe-area-inset-bottom,0) + 100px);background:linear-gradient(transparent,rgba(0,0,0,.88) 65%);max-width:600px;margin:0 auto}
.ov small{color:var(--gold);font-weight:600}
.ov h2{font-family:var(--display);font-size:38px;margin:2px 0 4px;line-height:1.05}
.ov p{margin:0 0 14px;color:#e5dccb}
.ov .row{display:flex;align-items:center;gap:12px}
.ov .pr{width:72px;height:72px;font-size:19px}
.cnt{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0) + 70px);color:#fff;background:rgba(0,0,0,.45);border-radius:99px;padding:3px 12px;font-size:13px}
.pill{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:11px 20px;font:600 15px var(--body);cursor:pointer}
#det{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#dbox{position:relative;background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:24px 24px 0 0;max-height:94dvh;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dimg{aspect-ratio:4/3;background:#101116;position:relative}
.ex{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s;pointer-events:none}
.ex.on{opacity:1}
.ex img,.ex video{width:100%;height:100%;object-fit:contain}
.x{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:24px;cursor:pointer}
.dbody{padding:16px 16px calc(env(safe-area-inset-bottom,0) + 24px)}
.dbody .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dbody h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.1}
.pr.big{flex:none;width:auto;min-width:76px;height:44px;border-radius:99px;padding:0 14px}
.chips{display:flex;gap:8px;margin:10px 0}
.chips span{border:1px solid var(--line);border-radius:10px;padding:4px 10px;color:var(--muted);font-size:14px}
.desc{color:#d9d0be;margin:6px 0 14px}
.tg,.fbb{width:100%;padding:13px;border-radius:14px;border:1px solid var(--kraft);background:linear-gradient(135deg,#2a2218,#1d1b1a);color:var(--gold);font:600 16px var(--body);cursor:pointer;margin-bottom:10px}
.fbb{border-color:var(--line);background:none;color:var(--muted);font-weight:500;margin:14px 0 0}
#stk{margin:4px 0 14px;padding-left:6px;border-left:2px dashed var(--kraft)}
.ing{display:flex;align-items:center;gap:14px;padding:6px 0 6px 14px;animation:drop .55s cubic-bezier(.2,1.4,.4,1) both}
.ing i{font-style:normal;font-size:34px;width:44px;text-align:center}
@keyframes drop{from{opacity:0;transform:translateY(-34px) scale(.8)}}
.dbody .qty.big{margin:8px 0}
.dbody .qty.big button{width:48px;height:48px;font-size:26px}
.dbody .qty.big b{font-size:20px;min-width:30px}
select,textarea{width:100%;margin-top:8px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px var(--body)}
.btn{display:block;width:100%;max-width:600px;margin:10px auto 0;padding:15px;border:0;border-radius:14px;background:var(--flame);color:#fff;font:600 17px var(--body);cursor:pointer}
.btn:disabled{opacity:.6}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:35;padding:12px 16px calc(env(safe-area-inset-bottom,0) + 12px);background:var(--bg);border-top:1px solid var(--line)}
#bar .btn{margin:0 auto}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:50}
#box{background:var(--bg);width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0) + 16px);max-height:85dvh;overflow:auto}
#box h2{font-family:var(--display);color:var(--gold);margin:0 0 8px}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.link{background:none;border:0;color:var(--muted);font:16px var(--body);padding:12px;width:100%;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 0}
.msg{text-align:center;padding:80px 16px;color:var(--muted)}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style>
</head>
<body>
<div id="mode"><button class="on" data-mode="grid">Menyu</button><button data-mode="story">Story</button></div>
<div class="wrap">
  <header><h1 class="logo" id="brand"></h1></header>
  <main id="menu"><p class="msg">Yüklənir...</p></main>
  <footer id="foot"></footer>
</div>
<div id="story" hidden></div>
<div id="det" hidden><div id="dbox"></div></div>
<div id="bar" hidden><button class="btn" id="open"></button></div>
<div id="sheet" hidden><div id="box"></div></div>

<script>
const SB_URL='https://jvvgylzfkciiaoodcsgf.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2dmd5bHpma2NpaWFvb2Rjc2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDgxNDQsImV4cCI6MjEwNjc4NDE0NH0.9hmwX-K8kpl5Pofyhgm4DzQ6OhpiRe4fM1Bds0OShMg';
const api=(p,o={})=>fetch(SB_URL+'/rest/v1/'+p,{method:o.m||'GET',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',...(o.h||{})},body:o.b?JSON.stringify(o.b):undefined});
const MIN={Prefer:'return=minimal'};
const q=new URLSearchParams(location.search);
const slug=location.pathname.split('/').filter(Boolean)[0]||q.get('r');
const table=q.get('t');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(Math.round(n*100)/100).toFixed(2);
const FB=['Gec gəldi','Soyuq idi','Dadı xoşuma gəlmədi','Digər'];
const cart={};let R,ITEMS=[],CATS=[],canOrder=false,CUR=null;
const fail=t=>{$('menu').innerHTML=`<p class="msg">${esc(t)}</p>`};

async function init(){
  if(!slug) return fail('Restoran tapılmadı.');
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem('m_'+slug))}catch(e){}
  if(cached) show(cached);
  try{
    const res=await api('restaurants?slug=eq.'+encodeURIComponent(slug)+'&active=eq.true&select=*,categories(*),items(*)&categories.order=sort&items.order=sort&items.available=eq.true');
    const d=(await res.json())[0];
    if(!d){ if(!cached) fail('Bu menyu tapılmadı.'); return }
    const str=JSON.stringify(d);
    if(!cached||JSON.stringify(cached)!==str){show(d);try{localStorage.setItem('m_'+slug,str)}catch(e){}}
    try{if(!sessionStorage.getItem('sc_'+d.id)){sessionStorage.setItem('sc_'+d.id,1);api('events',{m:'POST',b:{restaurant_id:d.id,type:'scan'},h:MIN})}}catch(e){}
  }catch(e){ if(!cached) fail('Bağlantı xətası. Yenidən yoxla.') }
}
function show(d){
  R=d;canOrder=!!(d.orders_enabled&&table);ITEMS=d.items||[];CATS=d.categories||[];
  applyTheme(d);render();repaint();paintBar();
}
/* Sahibkarın tənzimləmələri: restaurants.theme (jsonb) */
function applyTheme(r){
  document.title=r.name+' Menyu';document.body.dataset.theme=r.theme_key;
  const th=r.theme||{};
  for(const k of ['flame','flame2','gold','bg','card','ink','muted','kraft']) if(th[k]) document.documentElement.style.setProperty('--'+k,th[k]);
  if(th.font&&!document.getElementById('thf')){const l=document.createElement('link');l.id='thf';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(th.font)+':wght@700&display=swap';document.head.appendChild(l);document.documentElement.style.setProperty('--display',`'${th.font}',Georgia,serif`)}
  $('brand').innerHTML=th.logo_url?`<img src="${esc(th.logo_url)}" alt="${esc(r.name)}">`:esc(r.name);
  $('foot').textContent=(table?'Masa '+table+'. ':'')+'Qiymətlər '+r.currency+' ilədir';
}
const ingOf=s=>{const m=/^(\p{Extended_Pictographic}\S*)\s+(.+)$/u.exec(s);return m?{e:m[1],n:m[2]}:{e:'•',n:s}};
const art=x=>x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:`<div class="ph"><span>${esc(R?.name||'')}</span></div>`;
const media=u=>/\.(mp4|webm)(\?|$)/i.test(u)?`<video src="${esc(u)}" muted loop playsinline preload="metadata"></video>`:`<img src="${esc(u)}" alt="">`;
const qtyDiv=(id,c='')=>canOrder?`<div class="qty ${c}" data-q="${id}"></div>`:'';
const card=x=>`<article class="card" data-open="${x.id}"><div class="img">${art(x)}</div>${qtyDiv(x.id)}<div class="cp"><h3>${esc(x.name)}</h3><small>${esc(x.weight||'')}</small></div><div class="pr">${money(+x.price)}</div></article>`;
const slide=(x,c,i,n)=>`<section class="sl"><div class="bg">${art(x)}</div><div class="cnt">${i} / ${n}</div><div class="ov"><small>${esc(c)}</small><h2>${esc(x.name)}</h2>${x.description?`<p>${esc(x.description)}</p>`:''}<div class="row"><div class="pr">${money(+x.price)}</div><button class="pill" data-open="${x.id}">Ətraflı</button>${qtyDiv(x.id)}</div></div></section>`;
function render(){
  const known=new Set(CATS.map(c=>c.id));
  const groups=CATS.map(c=>({n:c.name,note:c.note,its:ITEMS.filter(x=>x.category_id===c.id)}));
  const rest=ITEMS.filter(x=>!known.has(x.category_id));
  if(rest.length)groups.push({n:'Digər',its:rest});
  const gs=groups.filter(g=>g.its.length);
  $('menu').innerHTML=gs.map(g=>`<section><h2>${esc(g.n)}</h2>${g.note?`<p class="note">${esc(g.note)}</p>`:''}<div class="grid">${g.its.map(card).join('')}</div></section>`).join('');
  const flat=gs.flatMap(g=>g.its.map(x=>[x,g.n]));
  $('story').innerHTML=flat.map(([x,c],i)=>slide(x,c,i+1,flat.length)).join('');
}
const qtyHtml=id=>{const n=cart[id]||0;return n?`<button class="minus" data-a="-" data-id="${id}" aria-label="Azalt">−</button><b>${n}</b><button data-a="+" data-id="${id}" aria-label="Artır">+</button>`:`<button data-a="+" data-id="${id}" aria-label="Səbətə at">+</button>`};
const repaint=()=>document.querySelectorAll('[data-q]').forEach(e=>e.innerHTML=qtyHtml(e.dataset.q));
function totals(){let n=0,t=0;for(const x of ITEMS){const c=cart[x.id]||0;n+=c;t+=c*x.price}return{n,t}}
function paintBar(){const {n,t}=totals();$('bar').hidden=!n;$('open').textContent=`Səbətə bax: ${n} məhsul, ${money(t)} ${R?.currency||''}`}
function lock(){document.body.style.overflow=(!$('det').hidden||!$('sheet').hidden||!$('story').hidden)?'hidden':''}

function openDet(id){
  const x=ITEMS.find(i=>i.id===id);if(!x)return;CUR=x;
  api('events',{m:'POST',h:MIN,b:{restaurant_id:R.id,type:'item_view',item_id:id}});
  const ing=x.ingredients||[];
  $('dbox').innerHTML=`<button class="x" data-close aria-label="Bağla">×</button><div class="dimg">${art(x)}${x.explode_url?`<div class="ex" id="ex">${media(x.explode_url)}</div>`:''}</div><div class="dbody">
  <div class="row"><h2>${esc(x.name)}</h2><span class="pr big">${money(+x.price)} ${esc(R.currency)}</span></div>
  <div class="chips">${x.weight?`<span>${esc(x.weight)}</span>`:''}${x.calories?`<span>🔥 ${x.calories} kkal</span>`:''}</div>
  ${x.description?`<p class="desc">${esc(x.description)}</p>`:''}
  ${(x.explode_url||ing.length)?`<button class="tg" data-ing>Tərkibi aç</button>${x.explode_url?'':'<div id="stk" hidden></div>'}`:''}
  ${qtyDiv(x.id,'big')}
  <button class="fbb" data-fb>Rəy bildir</button>
  <div id="fbf" hidden><select id="fk">${FB.map(f=>`<option>${f}</option>`).join('')}</select><textarea id="fm" rows="2" placeholder="Nə baş verdi? (istəyə bağlı)"></textarea><button class="btn" data-sendfb>Göndər</button></div></div>`;
  $('det').hidden=false;$('dbox').scrollTop=0;repaint();lock();
}
async function sendFb(b){
  b.disabled=true;
  const r=await api('feedback',{m:'POST',h:MIN,b:{restaurant_id:R.id,item_id:CUR.id,table_label:table,kind:$('fk').value,message:$('fm').value.trim()||null}});
  $('fbf').innerHTML=r.ok?'<p class="note">Rəyin restorana çatdı. Təşəkkür edirik!</p>':'<p class="note">Göndərilmədi, bir az sonra yenidən yoxla.</p>';
}
function openSheet(){
  const {n,t}=totals();if(!n){$('sheet').hidden=true;lock();return}
  const lines=ITEMS.filter(x=>cart[x.id]).map(x=>`<div class="line"><span>${cart[x.id]} x ${esc(x.name)}</span><span>${money(cart[x.id]*x.price)} ${esc(R.currency)}</span></div>`).join('');
  $('box').innerHTML=`<h2>Sifariş, masa ${esc(table)}</h2>${lines}<div class="line"><b>Cəmi</b><b>${money(t)} ${esc(R.currency)}</b></div>
  <textarea id="note" rows="2" placeholder="Qeyd (məsələn: soussuz)"></textarea><button class="btn" id="send">Sifarişi göndər</button><button class="link" data-close2>Geri qayıt</button>`;
  $('sheet').hidden=false;lock();
}
async function send(){
  const btn=$('send');btn.disabled=true;btn.textContent='Göndərilir...';
  const {t}=totals(),id=crypto.randomUUID();
  const o=await api('orders',{m:'POST',h:MIN,b:{id,restaurant_id:R.id,table_label:table,note:$('note').value.trim()||null,total:Math.round(t*100)/100}});
  if(!o.ok){btn.disabled=false;btn.textContent='Sifarişi göndər';alert('Sifariş göndərilmədi. Bir az sonra yenidən yoxla.');return}
  await api('order_items',{m:'POST',h:MIN,b:ITEMS.filter(x=>cart[x.id]).map(x=>({order_id:id,item_id:x.id,name:x.name,price:x.price,qty:cart[x.id]}))});
  api('events',{m:'POST',h:MIN,b:{restaurant_id:R.id,type:'order'}});
  for(const k in cart)delete cart[k];repaint();paintBar();
  $('box').innerHTML=`<h2>Sifariş göndərildi</h2><p class="note">Masa ${esc(table)} üçün sifarişin mətbəxə çatdı. Təşəkkür edirik!</p><button class="btn" data-close2>Bağla</button>`;
}
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-a]')){const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+(b.dataset.a==='+'?1:-1));repaint();paintBar();if(!$('sheet').hidden)openSheet();return}
  if(b=t.closest('[data-mode]')){const s=b.dataset.mode==='story';$('story').hidden=!s;$('menu').parentElement.hidden=s;document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));if(s)$('story').scrollTop=0;lock();return}
  if(b=t.closest('[data-open]')){openDet(b.dataset.open);return}
  if(t.closest('[data-close]')||t.id==='det'){$('det').hidden=true;lock();return}
  if(t.closest('[data-close2]')||t.id==='sheet'){$('sheet').hidden=true;lock();return}
  if(b=t.closest('[data-ing]')){const ex=$('ex'),st=$('stk');
    if(ex){const on=ex.classList.toggle('on');b.textContent=on?'Tərkibi bağla':'Tərkibi aç';const v=ex.querySelector('video');if(v){if(on){v.currentTime=0;v.play()}else v.pause()}}
    else if(st){const o=st.hidden;st.hidden=!o;b.textContent=o?'Tərkibi bağla':'Tərkibi aç';if(o)st.innerHTML=CUR.ingredients.map((v,i)=>`<div class="ing" style="animation-delay:${i*130}ms"><span>${esc(ingOf(v).n)}</span></div>`).join('')}
    return}
  if(t.closest('[data-fb]')){$('fbf').hidden=!$('fbf').hidden;return}
  if(b=t.closest('[data-sendfb]')){sendFb(b);return}
  if(t.closest('#open')){openSheet();return}
  if(t.id==='send')send();
});
init();
</script>
</body>
</html>
