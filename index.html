<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menyu</title>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15161c;--card:#1f212a;--ink:#f4ead8;--muted:#a9a190;--gold:#e9b45f;--flame:#f2661f;--flame2:#ff9c3d;--kraft:#b98a5a;--line:#2e303b;--display:'Almendra',Georgia,serif;--body:'Outfit',system-ui,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;padding-top:env(safe-area-inset-top,0);padding-bottom:calc(env(safe-area-inset-bottom,0) + 90px);background-image:radial-gradient(900px 400px at 50% -80px,color-mix(in srgb,var(--flame) 22%,transparent),transparent 70%)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{text-align:center;padding:34px 0 20px}
.logo{font-family:var(--display);font-size:clamp(52px,17vw,80px);line-height:1;margin:0;background:linear-gradient(180deg,var(--flame2),var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo img{max-height:90px;max-width:80%}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;color:var(--muted);text-decoration:none;font-weight:500;padding:8px 16px;border-radius:999px;border:1px solid var(--line)}
nav a.on{background:var(--flame);border-color:var(--flame);color:#fff}
section{padding-top:26px}
h2{font-family:var(--display);font-size:30px;margin:0 0 4px;color:var(--gold)}
.note{margin:0 0 12px;color:var(--muted);font-size:14px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--kraft);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:10px}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.grow{flex:1;min-width:0}
.item h3{margin:0;font-size:17px;font-weight:600}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.price{flex:none;min-width:62px;height:62px;padding:0 6px;border-radius:50%;display:grid;place-items:center;text-align:center;background:#101116;border:2px solid var(--gold);color:var(--gold);font-weight:700;font-size:17px;line-height:1.1}
.price small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:36px;height:36px;border-radius:50%;border:0;background:var(--flame);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.qty button.minus{background:var(--line)}
.qty b{min-width:18px;text-align:center}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom,0) + 12px);background:var(--bg);border-top:1px solid var(--line)}
.btn{display:block;width:100%;max-width:560px;margin:0 auto;padding:15px;border:0;border-radius:14px;background:var(--flame);color:#fff;font:600 17px var(--body);cursor:pointer}
.btn:disabled{opacity:.6}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:20}
#sheet .box{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0) + 16px);max-height:85vh;overflow:auto}
.line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
textarea{width:100%;margin:12px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px var(--body);resize:none}
.link{background:none;border:0;color:var(--muted);font:16px var(--body);padding:12px;width:100%;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 0}
.msg{text-align:center;padding:80px 16px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 class="logo" id="brand"></h1></header>
  <nav id="tabs" hidden></nav>
  <main id="menu"><p class="msg">Yüklənir...</p></main>
  <footer id="foot"></footer>
</div>
<div id="bar" hidden><button class="btn" id="open"></button></div>
<div id="sheet" hidden><div class="box" id="box"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* 1) Supabase API */
const SB_URL='https://jvvgylzfkciiaoodcsgf.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2dmd5bHpma2NpaWFvb2Rjc2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDgxNDQsImV4cCI6MjEwNjc4NDE0NH0.9hmwX-K8kpl5Pofyhgm4DzQ6OhpiRe4fM1Bds0OShMg';
const db=supabase.createClient(SB_URL,SB_KEY);
const q=new URLSearchParams(location.search);
const slug=location.pathname.split('/').filter(Boolean)[0]||q.get('r');
const table=q.get('t');           // masa nömrəsi: /snacky?t=5
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cart={};let R,ITEMS=[],canOrder=false;
const money=n=>(Math.round(n*100)/100).toFixed(2);
const fail=t=>{$('menu').innerHTML=`<p class="msg">${esc(t)}</p>`};

async function init(){
  if(!slug) return fail('Restoran tapılmadı.');
  const {data:r}=await db.from('restaurants').select('*').eq('slug',slug).eq('active',true).maybeSingle();
  if(!r) return fail('Bu menyu tapılmadı.');
  R=r; canOrder=!!(r.orders_enabled&&table);
  applyTheme(r);
  const [c,i]=await Promise.all([
    db.from('categories').select('*').eq('restaurant_id',r.id).order('sort'),
    db.from('items').select('*').eq('restaurant_id',r.id).eq('available',true).order('sort')]);
  ITEMS=i.data||[];
  render(c.data||[]);
  try{if(!sessionStorage.getItem('sc_'+r.id)){sessionStorage.setItem('sc_'+r.id,1);db.from('events').insert({restaurant_id:r.id,type:'scan'}).then(()=>{})}}catch(e){}
}

/* Sahibkarın tənzimləmələri: restaurants.theme (jsonb) — açarlar CSS dəyişənləridir */
function applyTheme(r){
  document.title=r.name+' Menyu';
  document.body.dataset.theme=r.theme_key;     // yeni dizayn = yuxarıdakı CSS-ə body[data-theme="..."] blokları əlavə et
  const th=r.theme||{};
  for(const k of ['flame','flame2','gold','bg','card','ink','muted','kraft']) if(th[k]) document.documentElement.style.setProperty('--'+k,th[k]);
  if(th.font){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(th.font)+':wght@700&display=swap';document.head.appendChild(l);document.documentElement.style.setProperty('--display',`'${th.font}',Georgia,serif`)}
  $('brand').innerHTML=th.logo_url?`<img src="${esc(th.logo_url)}" alt="${esc(r.name)}">`:esc(r.name);
  $('foot').textContent=(table?'Masa '+table+'. ':'')+'Qiymətlər '+r.currency+' ilədir';
}

function render(cats){
  const known=new Set(cats.map(c=>c.id));
  const other=ITEMS.filter(x=>!known.has(x.category_id));
  if(other.length) cats=[...cats,{id:'x',name:'Digər'}];
  $('tabs').innerHTML=cats.map(c=>`<a href="#c${c.id}" data-id="c${c.id}">${esc(c.name)}</a>`).join('');
  $('tabs').hidden=false;
  $('menu').innerHTML=cats.map(c=>{
    const its=c.id==='x'?other:ITEMS.filter(x=>x.category_id===c.id);
    return `<section id="c${c.id}"><h2>${esc(c.name)}</h2>${c.note?`<p class="note">${esc(c.note)}</p>`:''}${its.map(itemHtml).join('')}</section>`}).join('');
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const a=[...$('tabs').children];a.forEach(x=>x.classList.toggle('on',x.dataset.id===e.target.id));const on=$('tabs').querySelector('.on');if(on)$('tabs').scrollTo({left:on.offsetLeft-16,behavior:'smooth'})}}),{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('section').forEach(s=>io.observe(s));
}

function itemHtml(x){
  return `<div class="item">${x.image_url?`<img src="${esc(x.image_url)}" alt="" loading="lazy">`:''}
  <div class="grow"><h3>${esc(x.name)}</h3>${x.description?`<p>${esc(x.description)}</p>`:''}${canOrder?`<div class="qty" id="q${x.id}"></div>`:''}</div>
  <div class="price"><span>${money(+x.price)}<small>${x.weight?esc(x.weight):esc(R.currency)}</small></span></div></div>`;
}

function paintQty(id){
  const el=$('q'+id);if(!el)return;const n=cart[id]||0;
  el.innerHTML=n?`<button class="minus" data-a="-" data-id="${id}" aria-label="Azalt">−</button><b>${n}</b><button data-a="+" data-id="${id}" aria-label="Artır">+</button>`
    :`<button data-a="+" data-id="${id}" aria-label="Səbətə əlavə et">+</button>`;
}
function totals(){let n=0,t=0;for(const x of ITEMS){const q=cart[x.id]||0;n+=q;t+=q*x.price}return{n,t}}
function paintBar(){const {n,t}=totals();$('bar').hidden=!n;$('open').textContent=`Səbətə bax: ${n} məhsul, ${money(t)} ${R.currency}`}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+(b.dataset.a==='+'?1:-1));
  paintQty(id);paintBar();if(!$('sheet').hidden)openSheet();
});
document.addEventListener('DOMContentLoaded',()=>{});
$('open').onclick=()=>openSheet();
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').hidden=true};

function openSheet(){
  const {n,t}=totals();
  if(!n){$('sheet').hidden=true;return}
  const lines=ITEMS.filter(x=>cart[x.id]).map(x=>`<div class="line"><span>${cart[x.id]} x ${esc(x.name)}</span><span>${money(cart[x.id]*x.price)} ${esc(R.currency)}</span></div>`).join('');
  $('box').innerHTML=`<h2>Sifariş, masa ${esc(table)}</h2>${lines}<div class="line"><b>Cəmi</b><b>${money(t)} ${esc(R.currency)}</b></div>
  <textarea id="note" rows="2" placeholder="Qeyd (məsələn: soussuz)"></textarea>
  <button class="btn" id="send">Sifarişi göndər</button><button class="link" id="close">Geri qayıt</button>`;
  $('sheet').hidden=false;
  $('close').onclick=()=>{$('sheet').hidden=true};
  $('send').onclick=send;
}

async function send(){
  const btn=$('send');btn.disabled=true;btn.textContent='Göndərilir...';
  const {t}=totals(),id=crypto.randomUUID();
  const o=await db.from('orders').insert({id,restaurant_id:R.id,table_label:table,note:$('note').value.trim()||null,total:Math.round(t*100)/100});
  if(o.error){btn.disabled=false;btn.textContent='Sifarişi göndər';alert('Sifariş göndərilmədi. Bir az sonra yenidən yoxla.');return}
  const rows=ITEMS.filter(x=>cart[x.id]).map(x=>({order_id:id,item_id:x.id,name:x.name,price:x.price,qty:cart[x.id]}));
  await db.from('order_items').insert(rows);
  db.from('events').insert({restaurant_id:R.id,type:'order'}).then(()=>{});
  for(const k in cart)delete cart[k];
  ITEMS.forEach(x=>paintQty(x.id));paintBar();
  $('box').innerHTML=`<h2>Sifariş göndərildi</h2><p class="note">Masa ${esc(table)} üçün sifarişin mətbəxə çatdı. Təşəkkür edirik!</p><button class="btn" id="ok">Bağla</button>`;
  $('ok').onclick=()=>{$('sheet').hidden=true};
}

init().then(()=>{if(canOrder)ITEMS.forEach(x=>paintQty(x.id))});
</script>
</body>
</html>
