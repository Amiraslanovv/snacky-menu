<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İdarə paneli</title>
<style>
:root{--bg:#0e0f13;--side:#13141a;--card:#1a1c24;--card2:#21242e;--ink:#f1ece2;--muted:#8d8f9a;--acc:#f2661f;--acc2:#ff9c3d;--ok:#35c27a;--line:#2a2d38;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card2);transition:background .15s}
button:hover{background:#2a2e3a}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
button.d{color:#ff8a80}
input:not([type=checkbox]):not([type=color]):not([type=file]),select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1015;margin-top:5px}
textarea{resize:none}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--acc) 60%,transparent);border-color:transparent}
input[type=color]{width:64px;height:40px;border:1px solid var(--line);border-radius:8px;background:none;margin-top:5px;padding:2px}
label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}
.side{background:var(--side);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:18px;padding:2px 12px 18px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{text-align:left;border:0;background:none;color:var(--muted);padding:11px 14px;font-weight:500}
.nav button:hover{background:var(--card)}
.nav button.on{background:var(--card2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.out{margin-top:auto}
main{padding:24px;max-width:1120px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px}
.top select{width:auto;margin:0}
.top a{color:var(--muted)}
h2{margin:0 0 6px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted,small{color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.col h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.bd{background:var(--card2);border-radius:99px;padding:1px 9px;margin-left:6px;color:var(--ink)}
.oc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:14px;margin-bottom:10px}
.oc.preparing{border-left-color:#e9b45f}.oc.done{border-left-color:var(--ok);opacity:.8}
.oc .tb{font-size:20px;font-weight:700}
.oc .it{padding:2px 0}
.oc .btns{display:flex;gap:6px;margin-top:10px}
.oc .btns .p{flex:1}
.ir{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.th{width:52px;height:52px;border-radius:10px;background:var(--card2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px}
.th img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.catn{font-weight:600;font-size:16px;background:none!important;border:0!important;padding:4px 0!important;margin:0!important;width:auto!important;flex:1}
.sw{position:relative;display:inline-block;width:42px;height:24px;margin:0;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#3a3d4a;border-radius:99px;transition:.2s}
.sw span::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span::after{transform:translateX(18px)}
.kp.k4{grid-template-columns:repeat(4,1fr)}.kp.k4 b{font-size:24px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.up{color:var(--ok)}.dn{color:#ff8a80}
.rep{white-space:pre-wrap;background:#0f1015;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0 6px;font:14px/1.55 system-ui;color:var(--ink)}
.hrs{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.hrs div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.hrs i{display:block;width:100%;background:linear-gradient(180deg,var(--acc2),var(--acc));border-radius:3px 3px 0 0}
.hrs small{font-size:10px;height:14px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kp .card{margin:0}.kp b{font-size:30px;display:block}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.mb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:640px}
.mh,.mf{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mf{margin-top:18px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.mbx{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.pv{margin:8px 0;max-height:190px;border-radius:10px;overflow:hidden;background:#0f1015;min-height:50px;display:grid;place-items:center;color:var(--muted)}
.pv img,.pv video{max-width:100%;max-height:190px;display:block}
.btn2{display:inline-block;margin:0;color:var(--ink);padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card2);cursor:pointer;font-size:15px}
.sk{height:84px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.fbi{padding:12px 0;border-top:1px solid var(--line)}
.qr{display:inline-block;text-align:center;padding:10px;margin:6px;background:#fff;color:#000;border-radius:10px}
.lk{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.pvw{position:sticky;top:20px}
#pvw{border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0;min-height:260px;transition:background .2s}
.pvh{text-align:center;margin-bottom:10px}.pvh img{max-width:90%;object-fit:contain}
.pvs{font-size:24px;margin:10px 0 8px;font-weight:700}
.pvc{position:relative;background:#1f212a;border-radius:14px;overflow:hidden}
.pvi{aspect-ratio:4/3;background:#101116 center/cover}
.pvr{display:flex;justify-content:space-between;align-items:center;padding:10px;color:#f4ead8}
.pvp{border:2px solid;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;background:#101116;font:700 14px system-ui}
.pva{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 20px system-ui}
.mvb{display:flex;flex-direction:column;gap:3px;flex:none}
.mvb button{padding:2px 10px;line-height:1.15;font-size:13px}
.mvb button:disabled{opacity:.25;cursor:default}
.bds{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bp{margin:0;padding:8px 16px;border-radius:99px;border:1.5px solid var(--c);background:transparent;color:var(--c);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.bp:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.bp.on{background:var(--c);color:#fff;box-shadow:0 3px 12px color-mix(in srgb,var(--c) 45%,transparent)}
.bp .no{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:rgba(255,255,255,.3);font-size:11px}
.lnk{background:none;border:0;color:var(--acc2);padding:0 4px;text-decoration:underline;font-size:13px}
.bord{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.bo{display:inline-flex;align-items:center;gap:2px;margin:6px 8px 0 0;padding:3px 4px 3px 12px;border-radius:99px;color:#fff;font-size:13px;font-weight:600}
.bo button{padding:1px 8px;border:0;background:rgba(0,0,0,.25);color:#fff;border-radius:99px;font-size:13px;line-height:1.3;margin-left:2px}
.bo button:disabled{opacity:.3;cursor:default}
.mcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.mc{color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.chk{gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pss{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ps{display:flex;align-items:center;gap:6px;color:#fff;border-width:2px}
.ps i{width:14px;height:14px;border-radius:50%;display:inline-block}
input[type=range]{width:100%;margin-top:8px;accent-color:var(--acc)}
.cl{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.cl button{margin:4px 6px 0 0}
.lg{max-width:380px;margin:12vh auto;padding:0 16px}
.lg .card{padding:24px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:9px 20px;border-radius:99px;display:none;z-index:99}
#toast.bad{background:#d9453b}
code{display:block;white-space:pre-wrap;word-break:break-all;background:#0a0b0e;padding:10px;border-radius:8px;font-size:13px}
[hidden]{display:none!important}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;padding:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 .brand,.out{display:none}.nav{flex-direction:row}.nav button{white-space:nowrap}
 main{padding:14px}.cols,.kp,.g2,.g3,.lk,.c2{grid-template-columns:1fr}.kp.k4{grid-template-columns:1fr 1fr}.pvw{position:static}
}
@media print{.side,.top,.noprint{display:none!important}body{background:#fff}.app{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"><p style="padding:24px;color:#8d8f9a">Yüklənir...</p></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SB_URL='https://qybeegkeowpdkdmzoryj.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5YmVlZ2tlb3dwZGtkbXpvcnlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDk5NjYsImV4cCI6MjEwNjg4NTk2Nn0.MQ5iDWLxUXiKy3qbzAh6AbdxXeJyTfRVQ1hkYOw7n5o';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(Math.round(n*100)/100).toFixed(2);
const S={tab:'orders',rests:[],rest:null,p:null,C:{},nt:10,poll:false};
const NAV={orders:'Sifarişlər',menu:'Menyu',look:'Görünüş',stats:'Statistika',fb:'Rəylər',qr:'QR kodlar'};
const ST={new:'Yeni',preparing:'Hazırlanır',done:'Hazırdır',cancelled:'Ləğv'};
const skel=()=>'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
let tt;const toast=(t,bad)=>{const e=$('#toast');e.textContent=t;e.className=bad?'bad':'';e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2200)};
const chk=r=>{if(r.error){toast('Xəta: '+r.error.message,1);return false}return true};
const key=t=>t+':'+(S.rest?.id);

/* ---------- giriş ---------- */
async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return login();
  const {data:p}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p){$('#app').innerHTML='<div class="lg"><div class="card"><h2>Hesab bağlı deyil</h2><p class="muted">Hesabın hələ restorana bağlı deyil. Admindən xahiş et.</p><button data-act="out">Çıx</button></div></div>';return}
  S.p=p;
  if(p.role==='admin'){S.rests=(await db.from('restaurants').select('*').order('created_at')).data||[];S.rest=S.rests[0]||null;if(!S.rest)S.tab='rests'}
  else S.rest=(await db.from('restaurants').select('*').eq('id',p.restaurant_id).single()).data;
  shell();go(S.tab);
  if(S.rest)F.menu(S.rest.id).then(d=>{S.C[key('menu')]=d;if(S.tab==='orders')paint()}).catch(()=>{});
  if(!S.poll){S.poll=true;setInterval(()=>{if(S.tab==='orders'&&!document.hidden&&S.rest)go('orders',true)},8000)}
}
function login(msg){
  $('#app').innerHTML=`<div class="lg"><div class="card"><h2>İdarə paneli</h2><form id="lf"><label>E-poçt<input id="em" type="email" autocomplete="username" required></label><label>Şifrə<input id="pw" type="password" autocomplete="current-password" required></label><button class="p" style="width:100%;margin-top:16px">Daxil ol</button><p class="muted">${esc(msg||'')}</p></form></div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});r.error?login('E-poçt və ya şifrə səhvdir'):boot()};
}
function shell(){
  const adm=S.p.role==='admin',nav={...NAV,...(adm?{rests:'Restoranlar'}:{})};
  $('#app').innerHTML=`<div class="app"><aside class="side"><div class="brand">Menyu paneli</div><nav class="nav">${Object.entries(nav).map(([k,v])=>`<button data-act="tab" data-id="${k}">${v}</button>`).join('')}</nav><button class="out" data-act="out">Çıx</button></aside><main><div class="top" id="top"></div><div id="view"></div></main></div>`;
  topbar();
}
function topbar(){
  const adm=S.p.role==='admin';
  $('#top').innerHTML=`<div>${adm&&S.rests.length?`<select data-act="sel">${S.rests.map(r=>`<option value="${r.id}" ${S.rest?.id===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:`<h1>${esc(S.rest?.name||'')}</h1>`}</div>${S.rest?`<a href="/${esc(S.rest.slug)}" target="_blank" rel="noopener">Menyuya bax</a>`:''}`;
}

/* ---------- məlumat: əvvəl yadda qalan, sonra fonda yenilənir (yanıb-sönmə yoxdur) ---------- */
const F={
 orders:async id=>(await db.from('orders').select('*,order_items(*)').eq('restaurant_id',id).order('created_at',{ascending:false}).limit(40)).data||[],
 menu:async id=>{const [c,i]=await Promise.all([db.from('categories').select('*').eq('restaurant_id',id).order('sort'),db.from('items').select('*').eq('restaurant_id',id).order('sort')]);return {cats:c.data||[],items:i.data||[]}},
 fb:async id=>{const [f,i]=await Promise.all([db.from('feedback').select('*').eq('restaurant_id',id).order('created_at',{ascending:false}).limit(50),db.from('items').select('id,name').eq('restaurant_id',id)]);const nm={};(i.data||[]).forEach(x=>nm[x.id]=x.name);return (f.data||[]).map(x=>({...x,item:nm[x.item_id]||''}))},
 stats:async id=>{
  const since=new Date(Date.now()-30*864e5).toISOString();
  const [e,o,oi,i]=await Promise.all([
   db.from('events').select('type,item_id,created_at').eq('restaurant_id',id).gte('created_at',since).limit(5000),
   db.from('orders').select('created_at,total,status').eq('restaurant_id',id).neq('status','cancelled').gte('created_at',since).limit(5000),
   db.from('order_items').select('name,qty,price,orders!inner(restaurant_id,created_at,status)').eq('orders.restaurant_id',id).neq('orders.status','cancelled').gte('orders.created_at',since).limit(5000),
   db.from('items').select('id,name').eq('restaurant_id',id)]);
  const loc=t=>new Date(t).toLocaleDateString('sv'),nm={};(i.data||[]).forEach(x=>nm[x.id]=x.name);
  const days={};for(let k=29;k>=0;k--)days[loc(Date.now()-k*864e5)]={scan:0,order:0,rev:0};
  const today=loc(Date.now()),yest=loc(Date.now()-864e5),w7s=loc(Date.now()-6*864e5),hours=Array(24).fill(0);
  const tot={scan:0,item_view:0},views={};
  (e.data||[]).forEach(x=>{if(x.type==='scan'){tot.scan++;const d=days[loc(x.created_at)];if(d)d.scan++}else if(x.type==='item_view'){tot.item_view++;if(x.item_id)views[x.item_id]=(views[x.item_id]||0)+1}});
  const R={today:{r:0,c:0},yest:{r:0,c:0},w7:{r:0,c:0},m30:{r:0,c:0}};
  (o.data||[]).forEach(x=>{const k=loc(x.created_at),t=+x.total||0,d=days[k];if(d){d.order++;d.rev+=t}R.m30.r+=t;R.m30.c++;if(k>=w7s){R.w7.r+=t;R.w7.c++}if(k===today){R.today.r+=t;R.today.c++}if(k===yest){R.yest.r+=t;R.yest.c++}hours[new Date(x.created_at).getHours()]++});
  const tq={},tr={},td={};
  (oi.data||[]).forEach(x=>{tq[x.name]=(tq[x.name]||0)+x.qty;tr[x.name]=(tr[x.name]||0)+x.qty*x.price;if(loc(x.orders.created_at)===today)td[x.name]=(td[x.name]||0)+x.qty});
  const vw={};Object.entries(views).forEach(([k,v])=>vw[nm[k]||'?']=v);
  const srt=(m,n=6)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
  return {days,R,hours,tot,top:srt(tq),topRev:srt(tr).map(([n,v])=>[n,Math.round(v*100)/100]),topToday:srt(td,5),viewed:srt(vw)};
 }
};
async function go(tab,bg){
  S.tab=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
  if(!bg)paint();
  if(!S.rest||!F[tab])return;
  const rid=S.rest.id,k=tab+':'+rid;
  try{
    const d=await F[tab](rid);
    if(JSON.stringify(d)!==JSON.stringify(S.C[k])){
      const old=S.C[k];S.C[k]=d;
      if(tab==='orders'&&old&&d.some(o=>o.status==='new'&&!old.find(x=>x.id===o.id)))beep();
      if(S.tab===tab&&S.rest?.id===rid)paint();
    }
  }catch(e){}
}
function paint(){
  const v=$('#view');if(!v)return;
  v.innerHTML=S.rest||S.tab==='rests'?(V[S.tab]?V[S.tab](S.C[key(S.tab)]):''):'<p class="muted">Restoran yoxdur. "Restoranlar" bölməsindən əlavə et.</p>';
  if(S.tab==='qr')qrgo(false);
  if(S.tab==='look'){pvUpdate();checkFonts()}
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch(e){}}

/* ---------- şəkil / video yükləmə (Supabase Storage) ---------- */
const shrink=(f,max=1200)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(ok,'image/jpeg',.82)};i.onerror=()=>no(new Error('Şəkil oxunmadı'));i.src=URL.createObjectURL(f)});
const cleanLogo=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);

async function up(file,kind){

  if(kind==='logo'&&file.type.startsWith('image/')&&file.type!=='image/gif'){blob=await cleanLogo(file);ext='png'}
  else if(file.type.startsWith('image/')&&file.type!=='image/gif'){blob=await shrink(file);ext='jpg'}
  if(blob.size>10*1024*1024)throw new Error('Fayl 10 MB-dan böyükdür');
  const path=S.rest.id+'/'+crypto.randomUUID()+'.'+ext;

  const d=S.C[key('menu')];if(!d)return;
  const arr=t==='items'?d.items:d.cats,x=arr.find(r=>r.id===id);if(!x)return;
  const grp=(t==='items'?arr.filter(r=>r.category_id===x.category_id):arr.slice()).sort((a,b)=>(a.sort||0)-(b.sort||0));
  const i=grp.findIndex(r=>r.id===id),j=i+dir;if(j<0||j>=grp.length)return;
  [grp[i],grp[j]]=[grp[j],grp[i]];
  grp.forEach((r,k)=>r.sort=k+1);
  arr.sort((a,b)=>(a.sort||0)-(b.sort||0));
  paint();
  const res=await Promise.all(grp.map(r=>db.from(t).update({sort:r.sort}).eq('id',r.id)));
  if(res.some(r=>r.error))toast('Sıralama saxlanılmadı',1);
}
function openEdit(id){
  const d=S.C[key('menu')],x=d?.items.find(i=>i.id===id);if(!x)return;
  BD=(x.badges||[]).slice();
  $('#modal').innerHTML=`<div class="mb"><div class="mh"><h2>Məhsulu redaktə et</h2><button data-act="mclose">Bağla</button></div>
  <div class="g2"><label>Ad<input id="f_name" value="${esc(x.name)}"></label><label>Qiymət (${esc(S.rest.currency)})<input id="f_price" type="number" step="0.01" value="${x.price}"></label><label>Çəki / həcm<input id="f_weight" value="${esc(x.weight||'')}" placeholder="250 q"></label><label>Kalori (kkal)<input id="f_cal" type="number" value="${x.calories??''}"></label></div>
  <label>Kateqoriya<select id="f_cat">${d.cats.map(c=>`<option value="${c.id}" ${c.id===x.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label>Təsvir<textarea id="f_desc" rows="2">${esc(x.description||'')}</textarea></label>
  <div class="g2"><label>Köhnə qiymət (endirim və ya kombo qənaəti göstərmək üçün)<input id="f_old" type="number" step="0.01" value="${x.old_price??''}"></label><div></div></div>
  <div style="margin-top:12px"><small>Nişanlar: nə ardıcıllıqla toxunsan, menyuda o sırada görünür (1, 2, 3). Sırani dəyişmək üçün "Seçimi təmizlə" basıb istədiyin ardıcıllıqla yenidən toxun.</small><div id="bdbox"></div></div>
  <label>Tərkib (hər sətirdə biri, emojisiz)<textarea id="f_ing" rows="4">${esc((x.ingredients||[]).map(s=>s.replace(/^\p{Extended_Pictographic}\S*\s+/u,'')).join('\n'))}</textarea></label>
  ${mediaBox('image','Yeməyin şəkli',x.image_url)}${mediaBox('explode','Tərkib animasiyası (şəkil, GIF və ya MP4, ən çox 10 MB)',x.explode_url,true)}
  <label class="chk"><span class="sw"><input type="checkbox" id="f_av" ${x.available?'checked':''}><span></span></span> Menyuda göstərilir</label>
  <div class="mf"><button class="d" data-act="delitem" data-id="${id}">Məhsulu sil</button><span><button data-act="mclose">Ləğv</button> <button class="p" data-act="saveitem" data-id="${id}">Saxla</button></span></div></div>`;
  $('#modal').hidden=false;bdPaint();
}

/* ---------- hadisələr ---------- */
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#lookform'))pvUpdate()});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.up){
    const k=t.dataset.up,f=t.files[0];if(!f)return;const st=$('#st_'+k);st.textContent='Yüklənir...';
    try{const u=await up(f,k);$('#f_'+k).value=u;$('#pv_'+k).innerHTML=prev(u);st.textContent=k==='logo'?'Yükləndi, fon təmizləndi. Saxla düyməsinə bas.':'Yükləndi. Saxla düyməsinə bas.';if(S.tab==='look')pvUpdate()}catch(err){st.textContent='Xəta: '+(err.message||err)}
    t.value='';return;
  }
  if(t.dataset.av){const r=await db.from('items').update({available:t.checked}).eq('id',t.dataset.av);if(chk(r)){const x=S.C[key('menu')].items.find(i=>i.id===t.dataset.av);if(x)x.available=t.checked;toast('Saxlanıldı')}else t.checked=!t.checked;return}
  if(t.dataset.cn){if(chk(await db.from('categories').update({name:t.value.trim()||'Kateqoriya'}).eq('id',t.dataset.cn)))toast('Saxlanıldı');return}
  if(t.dataset.act==='sel'){S.rest=S.rests.find(r=>r.id===t.value);topbar();go(S.tab)}
});
document.addEventListener('click',async e=>{
  if(e.target.id==='modal'){$('#modal').hidden=true;return}
  const b=e.target.closest('button[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,rid=S.rest?.id,v=k=>$('#f_'+k)?.value??'';
  const again=t=>go(t||S.tab,true);
  if(a==='tab')return go(id);
  if(a==='out'){await db.auth.signOut();return login()}
  if(a==='mclose'){$('#modal').hidden=true;return}
  if(a==='clr'){$('#f_'+id).value='';$('#pv_'+id).innerHTML='Yoxdur';if(S.tab==='look')pvUpdate();return}
  if(a==='st'){if(chk(await db.from('orders').update({status:b.dataset.v}).eq('id',id)))again();return}
  if(a==='bdt'){const n=b.dataset.b,i=BD.indexOf(n);if(i<0)BD.push(n);else BD.splice(i,1);bdPaint();return}
  if(a==='bdc'){BD=[];bdPaint();return}
  if(a==='wa'){window.open('https://wa.me/?text='+encodeURIComponent(report(S.C[key('stats')])),'_blank');return}
  if(a==='cpy'){try{await navigator.clipboard.writeText(report(S.C[key('stats')]));toast('Kopyalandı')}catch(e){toast('Kopyalanmadı',1)}return}
  if(a==='mv'){await mv(b.dataset.t,id,+b.dataset.d);return}
  if(a==='edit')return openEdit(id);
  if(a==='addcat'){const n=prompt('Kateqoriya adı');if(n&&chk(await db.from('categories').insert({restaurant_id:rid,name:n,sort:(S.C[key('menu')]?.cats.length||0)+1})))again();return}
  if(a==='delcat'){if(confirm('Kateqoriya silinsin? Məhsullar "Kateqoriyasız" bölməsinə düşəcək.')&&chk(await db.from('categories').delete().eq('id',id)))again();return}
  if(a==='additem'){
    const r=await db.from('items').insert({restaurant_id:rid,category_id:id,name:'Yeni məhsul',price:0,sort:(S.C[key('menu')]?.items.length||0)+1}).select().single();
    if(chk(r)){S.C[key('menu')].items.push(r.data);paint();openEdit(r.data.id)}return}
  if(a==='saveitem'){
    const o={name:v('name').trim()||'Məhsul',price:+v('price')||0,weight:v('weight').trim()||null,calories:v('cal')===''?null:+v('cal'),category_id:v('cat')||null,description:v('desc').trim()||null,ingredients:v('ing').split('\n').map(s=>s.trim()).filter(Boolean),available:$('#f_av').checked,image_url:v('image')||null,explode_url:v('explode')||null,badges:BD.slice(),old_price:v('old')===''?null:+v('old')};
    if(chk(await db.from('items').update(o).eq('id',id))){toast('Saxlanıldı');$('#modal').hidden=true;again('menu')}return}
  if(a==='delitem'){if(confirm('Məhsul silinsin?')&&chk(await db.from('items').delete().eq('id',id))){$('#modal').hidden=true;again('menu')}return}
  if(a==='preset'){const q=b.dataset.p.split('|');$('#f_flame').value=q[1];$('#f_gold').value=q[2];$('#f_bg').value=q[3];$('#f_kraft').value=q[4];let fo=q[5];if(fo&&!(await fontOK(fo))){fo='';toast('Bu üslubun şrifti Azərbaycan hərflərini dəstəkləmir, standart şrift qoyuldu',1)}$('#f_font').value=fo;pvUpdate();return}
  if(a==='savelook'){
    const th={...(S.rest.theme||{}),flame:v('flame'),gold:v('gold'),bg:v('bg'),kraft:v('kraft')||undefined,font:v('font').trim()||undefined,logo_url:v('logo')||undefined,logo_size:(+v('lsize')&&+v('lsize')!==100)?+v('lsize'):undefined,bg_image:v('bgimg')||undefined};
    const o={theme:JSON.parse(JSON.stringify(th)),orders_enabled:$('#f_oe').checked};
    if(S.p.role==='admin'){o.theme_key=v('tk').trim()||'default';o.name=v('nm').trim()||S.rest.name}
    if(chk(await db.from('restaurants').update(o).eq('id',rid))){Object.assign(S.rest,o);topbar();toast('Saxlanıldı')}return}
  if(a==='qrgo')return qrgo();
  if(a==='print')return window.print();
  if(a==='addrest'){
    const slug=$('#ns').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),name=$('#nn').value.trim();
    if(!slug||!name)return toast('Link adı və ad lazımdır',1);
    if(chk(await db.from('restaurants').insert({slug,name}))){S.rests=(await db.from('restaurants').select('*').order('created_at')).data;if(!S.rest)S.rest=S.rests[0];topbar();paint()}return}
  if(a==='pickr'){S.rest=S.rests.find(r=>r.id===id);topbar();go('menu');return}
  if(a==='toggle'){const r=S.rests.find(x=>x.id===id);if(chk(await db.from('restaurants').update({active:!r.active}).eq('id',id))){r.active=!r.active;paint()}return}
});
const showErr=m=>{const a=document.getElementById('app');if(a&&!a.querySelector('.app,.lg'))a.innerHTML='<div class="lg"><div class="card"><h2>Xəta</h2><p class="muted">Panel açılmadı. Bu mətni mənə göndər:</p><code>'+String(m).replace(/</g,'&lt;')+'</code><button class="p" onclick="location.reload()">Yenilə</button></div></div>'};
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr(e.reason&&e.reason.message||e.reason));
boot();
</script>
</body>
</html>
